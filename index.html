<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M5 CAF Araç Arıza & Alarm Sorgulama Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #6f2c62;
            --primary-hover: #5a2350;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --info-bg: #f8fafc;
            --info-border: #f1f5f9;
        }

        [data-theme="dark"] {
            --primary: #a85597;
            --primary-hover: #8e447e;
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --info-bg: #0f172a;
            --info-border: #1e293b;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { 
            width: 100%; 
            max-width: 950px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        .header {
            background: linear-gradient(135deg, #6f2c62, #2d1128);
            color: white;
            padding: 18px 20px;
            border-radius: 14px;
            box-shadow: 0 10px 20px -5px rgba(111, 44, 98, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-badge {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #6f2c62;
            border: 2px solid rgba(255,255,255,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .header-text h1 { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
        .header-text p { color: #d8b9d1; font-size: 12px; }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        @media (max-width: 640px) {
            .search-form { grid-template-columns: 1fr; }
            .header { padding: 14px; }
            .header-text h1 { font-size: 15px; }
            .header-text p { font-size: 11px; }
            .action-bar { flex-direction: column; align-items: stretch !important; }
            .action-buttons { width: 100%; flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 11px; font-weight: 600; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; }

        .form-group input, .form-group select {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
            font-size: 14px;
            outline: none;
            background-color: var(--card-bg);
            color: var(--text-main);
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(111, 44, 98, 0.15);
        }

        .btn {
            padding: 0 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            -webkit-appearance: none;
        }

        .btn-clear { background-color: var(--info-bg); color: var(--text-main); }
        .btn-clear:hover { opacity: 0.8; }
        .btn-action { background-color: var(--primary); color: white; border: none; }
        .btn-action:hover { background-color: var(--primary-hover); }
        .btn-whatsapp { background-color: #25D366; color: white; border: none; }
        .btn-whatsapp:hover { background-color: #1da851; }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            -webkit-appearance: none;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .results-container { display: flex; flex-direction: column; gap: 14px; }
        .result-item { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 16px; 
            transition: background-color 0.3s, border-color 0.3s;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 8px;
        }

        .badges { display: flex; gap: 8px; align-items: center; }
        .badge-code { background-color: #f3e6f0; color: #6f2c62; padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 13px; }
        .badge-group { background-color: var(--info-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; }
        .badge-severity { padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; }

        .sev-AV, .sev-MA { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .sev-MI, .sev-AN { background-color: #fffbeb; color: #d97706; border: 1px solid #fef3c7; }
        .sev-IN, .sev-ES { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        [data-theme="dark"] .sev-AV, [data-theme="dark"] .sev-MA { background-color: #450a0a; color: #fca5a5; border-color: #7f1d1d; }
        [data-theme="dark"] .sev-MI, [data-theme="dark"] .sev-AN { background-color: #451a03; color: #fcd34d; border-color: #78350f; }
        [data-theme="dark"] .sev-IN, [data-theme="dark"] .sev-ES { background-color: #052e16; color: #86efac; border-color: #14532d; }

        .info-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .info-box { background-color: var(--info-bg); border-radius: 8px; padding: 12px; border: 1px solid var(--info-border); }
        .info-box.tr { border-left: 3px solid var(--primary); }
        .info-box h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
        .info-field { margin-bottom: 8px; }
        .info-field:last-child { margin-bottom: 0; }
        .field-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
        .field-value { font-size: 13px; color: var(--text-main); line-height: 1.4; }

        .no-result { text-align: center; padding: 20px; color: #ef4444; font-weight: 600; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); }
        .count-info { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <div class="header-badge">M5</div>
            <div class="header-text">
                <h1>M5 Hattı CAF Araç Arıza Rehberi</h1>
                <p>732 arıza / alarm kaydı • Kod veya grup ile anlık arama</p>
            </div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">
            <span id="themeIcon">🌙</span> <span id="themeText">Mod</span>
        </button>
    </div>

    <div class="card">
        <form class="search-form" id="searchForm" onsubmit="return false;">
            <div class="form-group">
                <label for="inputCode">Kod (Code)</label>
                <input type="text" id="inputCode" placeholder="Örn: 501, 10, 200" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="selectGroup">Grup (Group)</label>
                <select id="selectGroup">
                    <option value="">Tüm Gruplar</option>
                    <option value="APS">APS</option>
                    <option value="ATC">ATC</option>
                    <option value="BATT">BATT</option>
                    <option value="BCU">BCU</option>
                    <option value="CCTV">CCTV</option>
                    <option value="CMP">CMP</option>
                    <option value="DCU">DCU</option>
                    <option value="ELE">ELE</option>
                    <option value="EVR">EVR</option>
                    <option value="FDS">FDS</option>
                    <option value="GEN">GEN</option>
                    <option value="HVAC">HVAC</option>
                    <option value="OP">OP</option>
                    <option value="PIS">PIS</option>
                    <option value="TCU">TCU</option>
                    <option value="TMS">TMS</option>
                    <option value="WIR">WIR</option>
                </select>
            </div>
            <button type="button" class="btn btn-clear" onclick="clearSearch()">Temizle</button>
        </form>
    </div>

    <div class="action-bar">
        <div id="countInfo" class="count-info">Toplam 732 arıza / alarm kaydı. Arama yapmak için Kod veya Grup seçiniz.</div>
        <div class="action-buttons" id="exportButtons" style="display: none;">
            <button type="button" class="btn btn-action" onclick="copyResultsAsImage()">🖼️ Görsel Kopyala / İndir</button>
            <button type="button" class="btn btn-whatsapp" onclick="shareWhatsApp()">💬 WhatsApp Paylaş</button>
        </div>
    </div>

    <div id="resultsContainer" class="results-container"></div>
</div>

3Q01"},{"code":"5","group":"ELE","severity":"AV","mesajTr":"İMDAT FRENİ DEVRESİ ŞALTERİ ATTI","oneriTr":"İmdat freni devresinin sekonder röleleri hizmet dışı. MC1, MC2, M1 ve T2 no'lu vagonlarda arızanın devam etmesi durumunda 33Q01 ve 33Q02 kodlu Şalterleri kontrol edin. M1 ve M2 no'lu vagonlarda arızanın devam etmesi durumunda 33Q02 kodlu Şalteri kontrol edin.","messageEn":"EMERGENCY BRAKE LOOP CB TRIP","recommendationEn":"The secondary relays of the emergency brake loop are out of service. Check Circuit Breaker 33Q01 and 33Q02 if the fail is in the cars MC1,MC2,T1 and T2. If the fail is in the cars M1 and M2 check the circuit breaker 33Q02"},{"code":"6","group":"ELE","severity":"AV","mesajTr":"ENGEL ALGILAMA DEVRESİ ŞALTERİ ATTI","oneriTr":"Engel algılama devresi hizmet dışı. 49Q01 kodlu Şalteri kontrol edin","messageEn":"OBSTACLE DETECTION CB TRIP","recommendationEn":"The obstacle detection circuit is out of service. Check Circuit Breaker 49Q01"},{"code":"7","group":"ELE","severity":"AV","mesajTr":"YÜKSEK GERİLİM SİGORTASI ŞALTERİ ATTI","oneriTr":"APS ekipmanı ve Akü Şarj Ünitesine güç gelmiyor. 01F02 kodlu sigortayı kontrol edin.","messageEn":"HIGH VOLTAGE FUSE CB TRIP","recommendationEn":"The APS equipment and Battery Charger are not powered. Check fuse 01F02."},{"code":"8","group":"ELE","severity":"AV","mesajTr":"SIFIR HIZ DEVRESİ ŞALTERİ ATTI","oneriTr":"Sıfır hız devresi hizmet dışı. 18Q01 kodlu Şalteri kontrol edin","messageEn":"ZERO SPEED CB TRIP","recommendationEn":"The zero speed circuit is out of service. Check Circuit Breaker 18Q01"},{"code":"9","group":"ELE","severity":"AV","mesajTr":"KUMANDA TERK EMNİYET SİSTEMİ ŞALTERİ ATTI","oneriTr":"Kumanda terk emniyet sistemi hizmet dışı. 42Q01 kodlu Şalteri kontrol edin","messageEn":"DEAD MAN SYSTEM CB TRIP","recommendationEn":"The dead man system is out of service. Check Circuit Breaker 42Q01"},{"code":"10","group":"ELE","severity":"AV","mesajTr":"VIM MVB-ETH GW ŞALTERİ ATTI","oneriTr":"Tali telsiz ile MVB i     let currentFilteredData = [];

    function toggleTheme() {
        const body = document.body;
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Mod';
        } else {
            body.setAttribute('data-theme', 'dark');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Mod';
        }
    }

    function normalizeText(value) {
        return String(value ?? '')
            .trim()
            .toLocaleLowerCase('tr-TR');
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function filterData() {
        const input = document.getElementById('inputCode');
        const groupSelect = document.getElementById('selectGroup');
        const resultsContainer = document.getElementById('resultsContainer');
        const countInfo = document.getElementById('countInfo');
        const exportButtons = document.getElementById('exportButtons');

        if (!input || !groupSelect || !resultsContainer || !countInfo || !exportButtons) return;

        const inputCode = normalizeText(input.value);
        const selectGroup = groupSelect.value;

        if (!inputCode && !selectGroup) {
            currentFilteredData = [];
            resultsContainer.innerHTML = '';
            countInfo.textContent = `Toplam ${database.length} arıza / alarm kaydı. Arama yapmak için Kod veya Grup seçiniz.`;
            exportButtons.style.display = 'none';
            return;
        }

        currentFilteredData = database.filter(item => {
            const itemCode = normalizeText(item.code);
            const matchesCode = !inputCode || itemCode.indexOf(inputCode) !== -1;
            const matchesGroup = !selectGroup || item.group === selectGroup;
            return matchesCode && matchesGroup;
        });

        resultsContainer.innerHTML = '';

        if (currentFilteredData.length === 0) {
            countInfo.textContent = 'Sonuç bulunamadı.';
            exportButtons.style.display = 'none';
            resultsContainer.innerHTML =
                '<div class="no-result">Aramanıza uygun arıza/alarm kaydı bulunamadı.</div>';
            return;
        }

        countInfo.textContent = `Toplam ${currentFilteredData.length} kayıt bulundu.`;
        exportButtons.style.display = 'flex';

        const fragment = document.createDocumentFragment();

        currentFilteredData.forEach(item => {
            const resultItem = document.createElement('div');
            resultItem.className = 'result-item';

            const severityText = severityMap[item.severity] || item.severity;

            resultItem.innerHTML = `
                <div class="result-header">
                    <div class="badges">
                        <span class="badge-code">Kod: ${escapeHtml(item.code)}</span>
                        <span class="badge-group">Grup: ${escapeHtml(item.group)}</span>
                    </div>
                    <span class="badge-severity sev-${escapeHtml(item.severity)}">${escapeHtml(severityText)}</span>
                </div>
                <div class="info-grid">
                    <div class="info-box tr">
                        <h4>Türkçe Bilgiler</h4>
                        <div class="info-field">
                            <div class="field-label">Mesaj:</div>
                            <div class="field-value">${escapeHtml(item.mesajTr)}</div>
                        </div>
                        <div class="info-field">
                            <div class="field-label">Öneri / Çözüm:</div>
                            <div class="field-value">${escapeHtml(item.oneriTr)}</div>
                        </div>
                    </div>
                </div>
            `;

            fragment.appendChild(resultItem);
        });

        resultsContainer.appendChild(fragment);
    }

    // iOS Safari dahil klavye girişlerini güvenilir şekilde yakala.
    function setupSearchEvents() {
        const input = document.getElementById('inputCode');
        const groupSelect = document.getElementById('selectGroup');

        if (input) {
            ['input', 'keyup', 'change', 'search', 'compositionend'].forEach(eventName => {
                input.addEventListener(eventName, filterData, false);
            });
        }

        if (groupSelect) {
            groupSelect.addEventListener('change', filterData, false);
        }

        filterData();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupSearchEvents);
    } else {
        setupSearchEvents();
    }

    function clearSearch() {
        document.getElementById('inputCode').value = '';
        document.getElementById('selectGroup').value = '';
        filterData();
    }

    async function copyResultsAsImage() {
        const resultsContainer = document.getElementById('resultsContainer');
        if (!resultsContainer || !resultsContainer.hasChildNodes()) {
            alert("Kopyalanacak sonuç bulunamadı.");
            return;
        }

        try {
            const bgColor = getComputedStyle(document.body).backgroundColor;

            const canvas = await html2canvas(resultsContainer, {
                backgroundColor: bgColor,
                scale: 2,
                useCORS: true,
                logging: false
            });

            canvas.toBlob(async (blob) => {
                if (!blob) {
                    alert("Görsel oluşturulamadı.");
                    return;
                }

                let isCopied = false;
                if (navigator.clipboard && window.ClipboardItem) {
                    try {
                        const item = new ClipboardItem({ "image/png": blob });
                        await navigator.clipboard.write([item]);
                        alert("Sonuçlar pano görseli olarak kopyalandı!");
                        isCopied = true;
                    } catch (e) {
                        isCopied = false;
                    }
                }

                if (!isCopied) {
                    const link = document.createElement('a');
                    link.download = 'm5-ariza-sonuclari.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    alert("Uygulama içi kısıtlama nedeniyle görsel cihazınıza indirildi.");
                }
            }, 'image/png');

        } catch (err) {
            console.error("Kopyalama hatası:", err);
            alert("Görsel oluşturulurken bir sorun oluştu.");
        }
    }

    function shareWhatsApp() {
        if (currentFilteredData.length === 0) return;

        const now = new Date();
        const pad = value => String(value).padStart(2, '0');
        const dateTime = `${pad(now.getDate())}.${pad(now.getMonth() + 1)}.${now.getFullYear()} ${pad(now.getHours())}.${pad(now.getMinutes())}`;

        let text = "🚨 *M5 CAF Araç Arıza & Alarm Sorgulama Sonuçları* 🚨\n";
        text += `🕒 *Tarih / Saat:* ${dateTime}\n\n`;
        
        currentFilteredData.forEach((item, index) => {
            const severityText = severityMap[item.severity] || item.severity;
            text += `*${index + 1}. Kayıt*\n`;
            text += `• *Kod:* ${item.code}\n`;
            text += `• *Grup:* ${item.group}\n`;
            text += `• *Önem:* ${severityText}\n`;
            text += `• *Mesaj:* ${item.mesajTr}\n`;
            text += `• *Öneri:* ${item.oneriTr}\n\n`;
        });

        const encodedText = encodeURIComponent(text);
        window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
    }
</script>
